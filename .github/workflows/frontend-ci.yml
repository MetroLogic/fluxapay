name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Note: Sentry source-map upload is skipped unless production deployment is occurring
      SENTRY_ORG: mock-org
      SENTRY_PROJECT: mock-project
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_IGNORE_API_RESOLUTION_ERROR: 1
      SENTRY_DISABLE_AUTO_UPLOAD: true

    defaults:
      run:
        working-directory: ./fluxapay_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './fluxapay_frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Unit Tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/msplaywright
          key: ${{ runner.os }}-playwright-${{ hashFiles('fluxapay_frontend/package-lock.json') }}

      - name: Playwright Smoke Tests
        run: npm run test:e2e:smoke

  e2e-cross-browser:
    runs-on: ubuntu-latest
    needs: build-and-test

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SENTRY_ORG: mock-org
      SENTRY_PROJECT: mock-project
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_IGNORE_API_RESOLUTION_ERROR: 1
      SENTRY_DISABLE_AUTO_UPLOAD: true

    defaults:
      run:
        working-directory: ./fluxapay_frontend

    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './fluxapay_frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers for ${{ matrix.browser }}
        run: npx playwright install ${{ matrix.browser }} --with-deps

      - name: Run E2E tests on ${{ matrix.browser }}
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload Test Artifacts (${{ matrix.browser }})
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: fluxapay_frontend/playwright-report/
          retention-days: 14
