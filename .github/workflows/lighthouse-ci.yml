name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      SENTRY_ORG: mock-org
      SENTRY_PROJECT: mock-project
      SENTRY_AUTH_TOKEN: mock-token
      SENTRY_IGNORE_API_RESOLUTION_ERROR: 1
      SENTRY_DISABLE_AUTO_UPLOAD: true

    defaults:
      run:
        working-directory: ./fluxapay_frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './fluxapay_frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Disable Sentry source map upload for CI
          NEXT_SKIP_ENV_VALIDATION: true

      - name: Start Next.js app
        run: npm run start &
        env:
          NODE_ENV: production

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:3075 > /dev/null 2>&1; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app... ($i/30)"
            sleep 2
          done
          echo "App failed to start"
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './fluxapay_frontend/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: './fluxapay_frontend/.lighthouseci/'
          retention-days: 30
