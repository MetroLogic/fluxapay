name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan PR diff for committed secrets
        run: |
          set -euo pipefail

          # Regex rules for sensitive token patterns.
          # Stellar private seeds (S...), FluxaPay live API keys (fp_live_...),
          # database URLs with embedded credentials, and JWT secrets.
          PATTERNS='(^|[^A-Za-z0-9])S[A-Z2-7]{55}([^A-Za-z0-9]|$)|fp_live_[A-Za-z0-9]{16,}|(postgres(ql)?|mysql|mongodb(\+srv)?|redis)://[^:@/\s]+:[^@/\s]+@|(JWT_SECRET|ADMIN_JWT_SECRET|WEBHOOK_SECRET|ADMIN_SECRET)[[:space:]]*[:=][[:space:]]*["'"']?[A-Za-z0-9_\-]{16,}'

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch --no-tags origin "${{ github.base_ref }}" || true
            DIFF_RANGE="${BASE}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_RANGE="HEAD~1...HEAD"
            else
              DIFF_RANGE="${BEFORE}...HEAD"
            fi
          fi

          echo "Scanning diff range: ${DIFF_RANGE}"

          # Only inspect added lines in the diff.
          ADDED_LINES=$(git diff "${DIFF_RANGE}" --unified=0 --no-color | grep -E '^\+' | grep -vE '^\+\+\+' || true)

          if [ -z "${ADDED_LINES}" ]; then
            echo "No added lines to scan."
            exit 0
          fi

          MATCHES=$(printf '%s\n' "${ADDED_LINES}" | grep -nE "${PATTERNS}" || true)

          if [ -n "${MATCHES}" ]; then
            echo "::error::Potential secret(s) detected in this change set."
            echo ""
            echo "The following added lines matched secret-scanning rules:"
            printf '%s\n' "${MATCHES}"
            echo ""
            echo "How to fix:"
            echo "  1. Remove the secret from the offending file."
            echo "  2. Unstage it: git restore --staged <file>"
            echo "  3. Rotate the credential if it was ever pushed."
            echo "  4. Use environment variables or a secrets manager instead of hardcoding."
            exit 1
          fi

          echo "No secrets detected in the diff."

  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxapay_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret
      ADMIN_JWT_SECRET: ci-test-admin-jwt-secret
      WEBHOOK_SECRET: ci-test-webhook-secret
      STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
      STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
      FUNDER_SECRET_KEY: SBXEHJKWF7C7BIFSUGXZE7XKFJ5SP6Y7JGPD4J4TKMX2MQXWQQRF3BSG
      MASTER_VAULT_SECRET_KEY: SDGHCAPDRWTOTBAQT6HJ5KBUZOECD2JEOH6E76NDL4OXNBXIWODLZA4B
      USDC_ISSUER_PUBLIC_KEY: GBVXGET7UCLTTLDZGVWDDMZ7FVLCNZL75GU7BLVPTWUP6UIVYHAY5OAX
      KMS_PROVIDER: local
      KMS_ENCRYPTION_PASSPHRASE: ci-test-passphrase-for-hd-wallet-secure
      HD_WALLET_MASTER_SEED: ci-test-master-seed-32chars-long-padded!!
      DISABLE_CRON: "true"
      ADMIN_SECRET: ci-admin-secret-key

    defaults:
      run:
        working-directory: ./fluxapay_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './fluxapay_backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client and Push Schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Type Check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Integration Tests
        run: npm run test:integration

      - name: OpenAPI Validation
        run: npm run validate:openapi

      - name: API Collection Synchronization
        run: npm run check:api-collections

      - name: Route Coverage
        run: npm run check:route-coverage

      - name: Build
        run: npm run build

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: fluxapay_backend/dist/
