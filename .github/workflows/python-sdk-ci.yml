name: Python SDK CI

on:
  pull_request:
    paths:
      - "fluxapay_python_sdk/**"
      - ".github/workflows/python-sdk-ci.yml"
  push:
    branches:
      - main
    paths:
      - "fluxapay_python_sdk/**"
      - ".github/workflows/python-sdk-ci.yml"

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: ./fluxapay_python_sdk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fluxapay_python_sdk/pyproject.toml

      - name: Install SDK with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -v
