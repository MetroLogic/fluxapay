name: python-sdk-ci

# Unit tests for the Python SDK (#1267). Every HTTP call is mocked with respx,
# so no network access or sandbox credentials are needed.
on:
  pull_request:
    paths:
      - "fluxapay_python_sdk/**"
      - ".github/workflows/python-sdk-ci.yml"
  push:
    branches: [main]
    paths:
      - "fluxapay_python_sdk/**"

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: fluxapay_python_sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fluxapay_python_sdk/pyproject.toml

      - name: Install SDK with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest -q
